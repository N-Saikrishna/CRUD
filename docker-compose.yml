services:
  db:
    image: mysql:8.0
    container_name: contact-manager-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: COP4331
      MYSQL_USER: appuser
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    command: --default-authentication-plugin=mysql_native_password

  web:
    image: php:8.2-apache
    container_name: contact-manager-web
    depends_on:
      - db
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    environment:
      DB_HOST: db
      DB_NAME: COP4331
      DB_USER: appuser
      DB_PASS: app_password
    command: >
      bash -c "docker-php-ext-install mysqli pdo_mysql &&
      a2enmod rewrite &&
      apache2-foreground"

volumes:
  mysql_data:
