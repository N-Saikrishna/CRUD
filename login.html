<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Log In - Contact Manager</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="css/styles.css" rel="stylesheet">
</head>
<body>

<img src="images/ucf-knights-logo.png" alt="" class="bg-logo">

<div class="topbar-accent"></div>
<header class="topbar">
	<div class="topbar-brand">
		<span class="brand-mark" aria-hidden="true">C</span>
		<span class="topbar-title">Contact Manager</span>
	</div>
	<a href="index.html" class="btn btn-outline-secondary btn-sm">Home</a>
</header>

<main class="container py-5">

	<div class="brand-bar">
		<span class="brand-mark" aria-hidden="true">C</span>
		<h1 class="mb-0">Contact Manager</h1>
	</div>
	<p class="page-subtitle">Sign in to your address book</p>
	<div class="gold-rule"></div>

	<div class="row justify-content-center">
		<div class="col-12 col-md-8 col-lg-5">
			<a href="index.html" class="btn btn-outline-secondary btn-sm back-button">&larr; Back</a>
			<form id="loginForm" class="card p-4" novalidate>
				<div class="mb-3">
					<label for="loginName" class="form-label">Username</label>
					<input type="text" class="form-control" id="loginName"
					       name="loginName" autocomplete="username" required>
				</div>
				<div class="mb-3">
					<label for="loginPassword" class="form-label">Password</label>
					<input type="password" class="form-control" id="loginPassword"
					       name="loginPassword" autocomplete="current-password" required>
				</div>
				<button type="submit" class="btn btn-primary w-100" id="loginButton">Log In</button>
				<p id="loginResult" class="mt-3 mb-0 text-danger" role="status" aria-live="polite"></p>
			</form>
		</div>
	</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
