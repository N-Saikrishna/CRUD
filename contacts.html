<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>My Contacts</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<main class="container py-4">

	<h1>Contacts Manager</h1>

	<div class="input-group mb-3" style="max-width: 400px;">
		<input type="text" id="searchInput" class="form-control" placeholder="Search contacts">
		<button type="button" id="searchButton" class="btn btn-outline-secondary">Search</button>
	</div>

	<div class="table-responsive">
	<table class="table table-hover bg-white">
		<thead class="table-light">
		<tr>
			<th scope="col">First Name</th>
			<th scope="col">Last Name</th>
			<th scope="col">Phone #</th>
			<th scope="col">Email</th>
			<th scope="col">Date Added</th>
		</tr>
		</thead>
		<tbody id="contactsBody">
		</tbody>
	</table>
	</div>

	<h2 class="mt-4">Add Contact</h2>
	<form id="addContactForm" class="row g-2 align-items-end" style="max-width: 700px;">
		<div class="col">
			<label for="addFirstName" class="form-label">First Name</label>
			<input type="text" id="addFirstName" class="form-control" required>
		</div>
		<div class="col">
			<label for="addLastName" class="form-label">Last Name</label>
			<input type="text" id="addLastName" class="form-control" required>
		</div>
		<div class="col">
			<label for="addPhone" class="form-label">Phone #</label>
			<input type="text" id="addPhone" class="form-control" required>
		</div>
		<div class="col">
			<label for="addEmail" class="form-label">Email</label>
			<input type="email" id="addEmail" class="form-control" required>
		</div>
		<div class="col-auto">
			<button type="submit" class="btn btn-primary">Add Contact</button>
		</div>
	</form>

</main>

<div id="message" class="text-danger"></div>
<script src="js/contacts.js"></script>
</body>
</html>
