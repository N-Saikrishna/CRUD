<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>My Contacts</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="css/styles.css" rel="stylesheet">
</head>
<body>

<main class="container py-4 py-md-5">

	<div class="app-shell">

		<div class="app-header">
			<div class="brand-bar" style="justify-content: flex-start; margin-bottom: 0;">
				<span class="brand-mark" aria-hidden="true">C</span>
				<h1>Contacts Manager</h1>
			</div>
			<button type="button" id="logoutButton" class="btn btn-outline-secondary btn-sm">Log Out</button>
		</div>

		<span class="section-label">Add Contact</span>
		<form id="addContactForm" class="row g-2 align-items-end mb-4">
			<div class="col">
				<label for="addFirstName" class="form-label">First Name</label>
				<input type="text" id="addFirstName" class="form-control" required>
			</div>
			<div class="col">
				<label for="addLastName" class="form-label">Last Name</label>
				<input type="text" id="addLastName" class="form-control" required>
			</div>
			<div class="col">
				<label for="addPhone" class="form-label">Phone #</label>
				<input type="text" id="addPhone" class="form-control" required>
			</div>
			<div class="col">
				<label for="addEmail" class="form-label">Email</label>
				<input type="email" id="addEmail" class="form-control" required>
			</div>
			<div class="col-auto">
				<button type="submit" class="btn btn-success">Add Contact</button>
			</div>
		</form>

		<span class="section-label">Search</span>
		<div class="input-group mb-3" style="max-width: 400px;">
			<label for="searchInput" class="visually-hidden">Search contacts</label>
			<input type="text" id="searchInput" class="form-control" placeholder="Search contacts">
			<button type="button" id="searchButton" class="btn btn-outline-secondary">Search</button>
		</div>

		<div class="d-flex align-items-center gap-2 mb-3">
			<p id="resultCount" class="text-muted mb-0"></p>
			<button type="button" id="prevPage" class="btn btn-sm btn-outline-secondary" disabled>Previous</button>
			<button type="button" id="nextPage" class="btn btn-sm btn-outline-secondary" disabled>Next</button>
		</div>

		<div class="table-responsive">
		<table class="table table-hover">
			<thead>
			<tr>
				<th scope="col">First Name</th>
				<th scope="col">Last Name</th>
				<th scope="col">Phone #</th>
				<th scope="col">Email</th>
				<th scope="col">Date Added</th>
				<th scope="col">Actions</th>
			</tr>
			</thead>
			<tbody id="contactsBody">
			</tbody>
		</table>
		</div>

	</div>

</main>

<div id="message" class="text-danger container"></div>
<script src="js/contacts.js"></script>
</body>
</html>
