<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Contact Manager</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="css/styles.css" rel="stylesheet">
</head>
<body>

<img src="images/ucf-knights-logo.png" alt="" class="bg-logo">

<div class="topbar-accent"></div>
<header class="topbar">
	<div class="topbar-brand">
		<span class="brand-mark" aria-hidden="true">C</span>
		<span class="topbar-title">Contact Manager</span>
	</div>
	<a href="login.html" class="btn btn-login-topbar btn-sm">Login</a>
</header>

<main class="hero">

	<div class="hero-left">
		<div class="brand-bar">
			<span class="brand-mark" aria-hidden="true">C</span>
			<h1 class="mb-0">Contact Manager</h1>
		</div>
		<p class="page-subtitle">Sign in to your address book</p>
		<div class="gold-rule"></div>
		<button type="button" class="btn btn-primary" id="showRegisterButton">Register</button>
	</div>

	<div id="registerPanel" class="hero-right" hidden>
		<form id="registerForm" class="card p-4" novalidate>
			<button type="button" class="btn btn-outline-secondary btn-sm back-button" id="registerClose">&times; Close</button>
			<div class="row">
				<div class="col-12 col-sm-6 mb-3">
					<label for="registerFirstName" class="form-label">First name</label>
					<input type="text" class="form-control" id="registerFirstName"
					       name="registerFirstName" autocomplete="given-name" required>
				</div>
				<div class="col-12 col-sm-6 mb-3">
					<label for="registerLastName" class="form-label">Last name</label>
					<input type="text" class="form-control" id="registerLastName"
					       name="registerLastName" autocomplete="family-name" required>
				</div>
			</div>
			<div class="mb-3">
				<label for="registerLogin" class="form-label">Username</label>
				<input type="text" class="form-control" id="registerLogin"
				       name="registerLogin" autocomplete="username" required>
			</div>
			<div class="mb-3">
				<label for="registerPassword" class="form-label">Password</label>
				<input type="password" class="form-control" id="registerPassword"
				       name="registerPassword" autocomplete="new-password"
				       aria-describedby="passwordHelp" required>
				<div id="passwordHelp" class="form-text">At least 8 characters.</div>
			</div>
			<button type="submit" class="btn btn-primary w-100" id="registerButton">Create Account</button>
			<p id="registerResult" class="mt-3 mb-0 text-danger" role="status" aria-live="polite"></p>
		</form>
	</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/welcome.js"></script>
</body>
</html>
