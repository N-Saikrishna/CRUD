<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Contact Manager</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">

<main class="container py-5">

	<h1 class="text-center mb-4">Contact Manager</h1>

	<div class="row justify-content-center">
		<div class="col-12 col-md-10 col-lg-8">

			<ul class="nav nav-tabs mb-3" role="tablist">
				<li class="nav-item" role="presentation">
					<button class="nav-link active" id="loginTab" data-bs-toggle="tab"
					        data-bs-target="#loginPanel" type="button" role="tab"
					        aria-controls="loginPanel" aria-selected="true">Log In</button>
				</li>
				<li class="nav-item" role="presentation">
					<button class="nav-link" id="registerTab" data-bs-toggle="tab"
					        data-bs-target="#registerPanel" type="button" role="tab"
					        aria-controls="registerPanel" aria-selected="false">Create Account</button>
				</li>
			</ul>

			<div class="tab-content">

				<div class="tab-pane fade show active" id="loginPanel" role="tabpanel" aria-labelledby="loginTab">
					<form id="loginForm" class="card p-4" novalidate>
						<div class="mb-3">
							<label for="loginName" class="form-label">Username</label>
							<input type="text" class="form-control" id="loginName"
							       name="loginName" autocomplete="username" required>
						</div>
						<div class="mb-3">
							<label for="loginPassword" class="form-label">Password</label>
							<input type="password" class="form-control" id="loginPassword"
							       name="loginPassword" autocomplete="current-password" required>
						</div>
						<button type="submit" class="btn btn-primary w-100" id="loginButton">Log In</button>
						<p id="loginResult" class="mt-3 mb-0 text-danger" role="status" aria-live="polite"></p>
					</form>
				</div>

				<div class="tab-pane fade" id="registerPanel" role="tabpanel" aria-labelledby="registerTab">
					<form id="registerForm" class="card p-4" novalidate>
						<div class="row">
							<div class="col-12 col-sm-6 mb-3">
								<label for="registerFirstName" class="form-label">First name</label>
								<input type="text" class="form-control" id="registerFirstName"
								       name="registerFirstName" autocomplete="given-name" required>
							</div>
							<div class="col-12 col-sm-6 mb-3">
								<label for="registerLastName" class="form-label">Last name</label>
								<input type="text" class="form-control" id="registerLastName"
								       name="registerLastName" autocomplete="family-name" required>
							</div>
						</div>
						<div class="mb-3">
							<label for="registerLogin" class="form-label">Username</label>
							<input type="text" class="form-control" id="registerLogin"
							       name="registerLogin" autocomplete="username" required>
						</div>
						<div class="mb-3">
							<label for="registerPassword" class="form-label">Password</label>
							<input type="password" class="form-control" id="registerPassword"
							       name="registerPassword" autocomplete="new-password"
							       aria-describedby="passwordHelp" required>
							<div id="passwordHelp" class="form-text">At least 8 characters.</div>
						</div>
						<button type="submit" class="btn btn-primary w-100" id="registerButton">Create Account</button>
						<p id="registerResult" class="mt-3 mb-0 text-danger" role="status" aria-live="polite"></p>
					</form>
				</div>

			</div>
		</div>
	</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
